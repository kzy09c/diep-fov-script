<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Drone heading lines intersect at an estimated cursor</title>
<desc id="desc">A line from drone center zero zero in direction one one intersects a line from four zero in direction minus one one at two two. Screen Y increases downward.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#087f8c" stroke-width="1.5"/></marker></defs>
<rect width="900" height="460" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172b4d">
<text x="30" y="36" font-size="22" font-weight="bold">Heading lines constrain a shared cursor</text>
<text x="30" y="62" font-size="14" fill="#52647a">Example in local coordinates; positive Y points downward.</text>
<g stroke="#dce4ed" stroke-width="1"><path d="M80 100H620M80 200H620M80 300H620M80 400H620M180 85V425M280 85V425M380 85V425M480 85V425M580 85V425"/></g>
<g stroke="#087f8c" stroke-width="3" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M170 90L500 420"/><path d="M590 90L260 420"/></g>
<circle cx="180" cy="100" r="7" fill="#172b4d"/><circle cx="580" cy="100" r="7" fill="#172b4d"/>
<rect x="79" y="116" width="155" height="29" rx="5" fill="#f8fafc"/><text x="90" y="136" font-size="17">p1 = (0, 0)</text>
<rect x="499" y="116" width="155" height="29" rx="5" fill="#f8fafc"/><text x="510" y="136" font-size="17">p2 = (4, 0)</text>
<circle cx="380" cy="300" r="14" fill="#d1fae5" stroke="#087443" stroke-width="2"/><path d="M358 300H402M380 278V322" stroke="#087443" stroke-width="2"/>
<rect x="405" y="285" width="140" height="33" rx="5" fill="#f8fafc"/><text x="415" y="308" font-size="18" fill="#087443">q = (2, 2)</text>
<text x="670" y="133" font-size="16" font-weight="bold">What the crossing means</text>
<text x="670" y="166" font-size="14"><tspan x="670">Both heading axes pass</tspan><tspan x="670" dy="21">through this candidate.</tspan><tspan x="670" dy="37">Angle and position error</tspan><tspan x="670" dy="21">turn a point into a region.</tspan><tspan x="670" dy="37">Near-parallel lines give</tspan><tspan x="670" dy="21">unstable or unbounded</tspan><tspan x="670" dy="21">distance estimates.</tspan></text>
<text x="30" y="445" font-size="13" fill="#52647a">Full lines allow crossings in either direction. The player locator additionally requires a shared forward or reverse fit.</text>
</g></svg>
