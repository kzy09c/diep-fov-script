<svg xmlns="http://www.w3.org/2000/svg" width="900" height="525" viewBox="0 0 900 525" role="img" aria-labelledby="title desc">
<title id="title">Grow a previous player region, then intersect with a cursor-derived observation</title>
<desc id="desc">The previous region from zero to ten on both axes grows by two units to minus two through twelve. Intersecting with the cursor-derived region eight to twenty in X and four to eight in Y leaves eight to twelve in X and four to eight in Y.</desc>
<rect width="900" height="525" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172b4d">
<text x="30" y="36" font-size="22" font-weight="bold">Possible player positions: grow, then intersect</text>
<text x="30" y="62" font-size="14" fill="#52647a">Speed-only example: V = 2 units/s, elapsed time = 1 s. Positive Y points downward.</text>
<rect x="90" y="105" width="350" height="350" fill="#dbeafe" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="140" y="155" width="250" height="250" fill="#f1f5f9" stroke="#52647a" stroke-width="2" stroke-dasharray="3 4"/>
<rect x="340" y="255" width="300" height="100" fill="#fbbf24" fill-opacity=".22" stroke="#b86b08" stroke-width="2"/>
<rect x="340" y="255" width="100" height="100" fill="#86efac" fill-opacity=".8" stroke="#087443" stroke-width="3"/>
<path d="M90 475H650M65 105V455" fill="none" stroke="#52647a" stroke-width="1.5"/>
<g font-size="13" text-anchor="middle"><text x="90" y="495">-2</text><text x="140" y="495">0</text><text x="340" y="495">8</text><text x="390" y="495">10</text><text x="440" y="495">12</text><text x="640" y="495">20</text></g>
<g font-size="13" text-anchor="end"><text x="55" y="110">-2</text><text x="55" y="160">0</text><text x="55" y="260">4</text><text x="55" y="360">8</text><text x="55" y="410">10</text><text x="55" y="460">12</text></g>
<text x="165" y="198" font-size="16">Previous feasible region</text><text x="165" y="222" font-size="14">[0, 10] x [0, 10]</text>
<text x="109" y="132" font-size="14" fill="#1d4ed8">Grown prediction</text>
<text x="465" y="287" font-size="14" fill="#8a5005">Cursor-derived</text><text x="465" y="309" font-size="14" fill="#8a5005">observation</text>
<text x="390" y="297" font-size="14" text-anchor="middle" fill="#075c36" font-weight="bold">Surviving</text><text x="390" y="319" font-size="14" text-anchor="middle" fill="#075c36" font-weight="bold">region</text>
<g font-size="14"><text x="680" y="130" font-size="16" font-weight="bold">Set update</text><text x="680" y="165">1. Allow movement.</text><text x="680" y="198">2. Apply cursor evidence.</text><text x="680" y="231">3. Keep the overlap.</text>
<text x="680" y="284" fill="#087443" font-weight="bold">New feasible region:</text><text x="680" y="310">[8, 12] x [4, 8]</text>
<text x="680" y="365" fill="#52647a"><tspan x="680">The active code grows</tspan><tspan x="680" dy="21">multiple hypotheses with</tspan><tspan x="680" dy="21">velocity and acceleration</tspan><tspan x="680" dy="21">bounds before intersecting.</tspan></text></g>
<text x="30" y="519" font-size="12" fill="#52647a">The amber region already includes the opponent's view half-size and cursor uncertainty; it is not the cursor point itself.</text>
</g></svg>
